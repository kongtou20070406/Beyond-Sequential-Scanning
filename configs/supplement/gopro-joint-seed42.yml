name: gopro-joint-seed42
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42
find_unused_parameters: false
datasets:
  train:
    name: GoProLargeTrain
    type: PairedImageDataset
    dataroot_gt: __DATA_ROOT__/train/sharp
    dataroot_lq: __DATA_ROOT__/train/blur
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 128
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 16
    batch_size_per_gpu: 32
    pin_memory: true
    dataset_enlarge_ratio: 5
    prefetch_mode: null
    meta_info_file: supplement/reference/train_order.txt
network_g:
  type: VIVNetRadialProfiledAblation
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks:
  - 3
  - 3
  - 5
  num_refinement_blocks: 4
  ffn_expansion_factor: 3
  bias: false
  K: 5
  rho_max: 0.95
  group_size: 4
  linear_tilt_init: 0.2
  curved_tilt_init: 0.01
  ablation: identity_memory_uniform_readout
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  optim_g:
    type: AdamW
    lr: 0.0002
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 59220
    eta_min: 0.0
  total_iter: 49350
  warmup_iter: 4935
  use_grad_clip: false
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean
  use_amp: true
  amp_dtype: bfloat16
  microbatch_size: 8
logger:
  print_freq: 200
  save_checkpoint_freq: 4935
  use_tb_logger: false
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
