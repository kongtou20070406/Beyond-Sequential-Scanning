name: ohaze-cspn-context-seed42
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42
datasets:
  train:
    name: TrainSet
    type: PairedImageDataset
    dataroot_gt: data/ohaze/train/gt
    dataroot_lq: data/ohaze/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2
    pin_memory: true
    dataset_enlarge_ratio: 200
    prefetch_mode: null
network_g:
  type: CSPNGeneratorControl
  inp_channels: 3
  out_channels: 3
  dim: 32
  num_blocks:
  - 2
  - 3
  - 4
  num_refinement_blocks: 4
  ffn_expansion_factor: 3
  bias: false
  mixer_type: cspn_style
  K: 5
  generator: context
  compiler_seed: 42
path:
  pretrain_network_g: null
  strict_load_g: null
  resume_state: null
train:
  optim_g:
    type: AdamW
    lr: 0.001
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.9
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 55800
    eta_min: 1.0e-07
  total_iter: 55800
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean
logger:
  print_freq: 200
  save_checkpoint_freq: 5000
  use_tb_logger: false
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: gloo
  port: 29500
